<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/img.svg" />
  <!-- preload Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  >

  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    >
  </noscript>
  
  <!-- Main SEO -->
  <title>Vedant Patil | Full Stack Web Developer</title>
  <meta name="description" content="Official website of Vedant Patil, Full Stack Web Developer. I'm dedicated to creating engaging digital experiences and always strive to deliver the best solution for every project I work on." />
  <meta name="keywords" content="Vedant Patil, Full Stack Web Developer, vedantpatil, Portofolio Vedant" />
  <meta name="author" content="Vedant Patil" />

  <!-- Google Search Console -->


  <!-- Theme / PWA -->
  <meta name="theme-color" content="#030014" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://Vedant.com/" />
  <meta property="og:title" content="Vedant Patil | Full Stack Web Developer" />
  <meta property="og:description" content="Official website and portfolio of Vedant Patil, Full Stack Web Developer." />
  <meta property="og:image" content="https://Vedant.com/Meta.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://Vedant.com/" />
  <meta name="twitter:title" content="Vedant Patil | Full Stack Web Developer" />
  <meta name="twitter:description" content="Official website and portfolio of Vedant Patil." />
  <meta name="twitter:image" content="https://Vedant.com/Meta.png" />

  <!-- Canonical -->
  <link rel="canonical" href="https://Vedant.com/" />

  <!-- Structured Data: Person -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Vedant Patil",
    "url": "https://Vedant.com",
    "image": "https://Vedant.com/Photo.jpg",
    "jobTitle": "Full Stack Web Developer",
    "description": "I'm dedicated to creating engaging digital experiences and always strive to deliver the best solution for every project I work on.",
    "sameAs": [
      "https://www.linkedin.com/in/vedpatil15/",
      "https://github.com/Vedp6",
    ]
  }
  </script>
</head>

<body>
  <!-- Important text content for SEO -->
  <header style="display:none">
    <h1>Vedant Patil</h1>
    <p>
      I'm dedicated to creating engaging digital experiences and always strive to deliver the best solution for every project I work on.
    </p>
  </header>

  <!-- Root React -->
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
